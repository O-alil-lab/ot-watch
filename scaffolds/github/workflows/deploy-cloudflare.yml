# Déploie OT Watch LIVE sur Cloudflare Workers (free tier) à chaque tag v*.*.*
# Secrets GitHub requis : CLOUDFLARE_API_TOKEN (Workers:Edit), CLOUDFLARE_ACCOUNT_ID
name: Deploy Cloudflare (free tier)
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wrangler deploy (Python Worker)
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy --var ENV_NAME:ci
