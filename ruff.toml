# Config lint OT Watch (ECC verification-loop, phase 3)
line-length = 120

[lint]
select = ["E", "F", "W", "I", "UP", "SIM", "BLE", "RUF"]
ignore = [
  "BLE001",  # collect.py : erreurs réseau journalisées puis retentées (résilience NVD)
  "EXE001",  # scripts lancés via `python3 src/...`
  "E501",    # templates HTML : longues lignes acceptées
]

[lint.per-file-ignores]
"tests/**" = ["E402", "RUF100", "SIM115", "RUF015", "I001", "RUF059"]  # fixtures de test : style allégé
"server.py" = ["RUF001", "RUF100"]
"src/collect.py" = ["E402"]  # sys.path.insert nécessaire avant import store/validate  # HTML/JS embarqué (texte FR, tirets)
