# Image OT Watch -> GitHub Container Registry (GHCR), 100 % gratuit sur dépôt public.
# Deux jobs volontairement séparés :
#   scan  : build local + Trivy, permissions lecture seule, aucun secret exposé
#   push  : build + push GHCR avec GITHUB_TOKEN (packages: write), aucun outil tiers de scan
# Sécurité chaîne d'approvisionnement : trivy-action <= v0.34.2 a été compromis
# (CVE-2026-33634, mars 2026). Seule v0.35.0 est saine ; épinglez-la idéalement par SHA complet.
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths: ["Dockerfile", "requirements.txt", ".github/workflows/docker.yml"]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (local, non poussé)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: otwatch:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy — vulnérabilités CRITICAL/HIGH bloquantes
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: otwatch:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  push:
    needs: scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR (GITHUB_TOKEN, aucun PAT)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags / labels OCI
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
