# Déploie OT Watch LIVE sur Cloudflare Workers (free tier) à chaque tag v*.*.*
# Secrets GitHub requis : CLOUDFLARE_API_TOKEN (Workers:Edit), CLOUDFLARE_ACCOUNT_ID.
# Sans ces secrets, le job se termine proprement avec une note (pas d'échec à chaque tag).
name: Deploy Cloudflare (free tier)
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets absents
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID non définis — déploiement Worker ignoré"
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: "22"
      - name: Wrangler deploy (Python Worker)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: workers
        run: npx --yes wrangler deploy --var ENV_NAME:ci
